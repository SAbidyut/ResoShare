name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:54329/resoshare_test
      - run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, screenshot walkthroughs, release builds (unsigned)
        run: >-
          ./gradlew --no-daemon
          lintUserDemoDebug lintAdminDemoDebug
          testUserDemoDebugUnitTest testAdminDemoDebugUnitTest
          assembleUserDemoRelease assembleAdminDemoRelease assembleUserLiveRelease assembleAdminLiveRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/app/build/screens
