org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- ResoShare configuration ----
# Base URL of the deployed backend (must be HTTPS and end with /).
RESO_API_BASE_URL=https://share.rapti.net/
# Optional certificate pins for the API host, comma separated, e.g.
# sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=,sha256/BBBB...=
# Leave empty when the API sits behind a CDN whose certificates rotate.
RESO_CERT_PINS=
