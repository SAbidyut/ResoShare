# ResoShare production stack: Caddy (automatic HTTPS) → API → PostgreSQL.
# Usage: cp .env.example .env && (fill secrets) && docker compose up -d --build
#
# Database roles:
#   resoshare      owner/superuser — used ONLY by the one-shot `migrate` job (schema changes, role grants)
#   resoshare_app  restricted runtime role — the only credentials the API ever sees
#                  (no superuser, owns nothing, audit_log: SELECT + INSERT only)
# Backups: the `backup` service (owner creds, internal network only) writes daily pg_dump files
# into the `backups` volume; see README "Backups".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resoshare
      POSTGRES_USER: resoshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [internal]          # never published to the host or the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resoshare -d resoshare"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  migrate:
    build: .
    restart: "no"
    command: ["node", "dist/src/cli/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://resoshare:${POSTGRES_PASSWORD}@db:5432/resoshare
      APP_DB_USER: resoshare_app
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Runtime role only. The API refuses to start if this is a superuser or the owner of audit_log.
      DATABASE_URL: postgres://resoshare_app:${POSTGRES_APP_PASSWORD}@db:5432/resoshare
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "1"             # exactly one trusted hop: the Caddy container
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      HMAC_KEY: ${HMAC_KEY:?set HMAC_KEY in .env}
      DATA_ENC_KEY: ${DATA_ENC_KEY:?set DATA_ENC_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKUP_DIR: /backups
    volumes:
      - uploads:/data/uploads
      # Only to drop `.request` and read `status.json`; the directory is not listable by the API user
      # and the dumps are mode 600, so the API cannot read or delete them.
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, web]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: resoshare            # owner: needs to read every table (audit_log included)
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: resoshare
      BACKUP_DIR: /backups
      BACKUP_AT: "03:00"           # Asia/Dhaka
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]           # no internet, no published ports
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]              # pg_dump needs no capabilities
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [web]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]  # only to bind :80/:443
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true                 # no outbound internet for db/api traffic on this network
  web: {}

volumes:
  dbdata: {}
  uploads: {}
  backups: {}
  caddy_data: {}
  caddy_config: {}
